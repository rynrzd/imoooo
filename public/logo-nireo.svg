  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  <!-- « N » ascendant : la progression du patrimoine -->
