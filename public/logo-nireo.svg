<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nireo">
  <title>Nireo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15161c" />
      <stop offset="1" stop-color="#0b0c10" />
    </linearGradient>
    <linearGradient id="mark" x1="106" y1="426" x2="426" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfe4f6" />
      <stop offset="0.5" stop-color="#9fa8f0" />
      <stop offset="1" stop-color="#8fd6ea" />
